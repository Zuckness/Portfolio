<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>John Isaac F. Castillo - Portfolio</title>
<meta name="description" content="Portfolio of selected projects.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">

<style>
  :root {
    --mist: #E8ECF4;
    --paper: #F7F9FD;
    --ink: #101B3D;
    --ink-soft: #4B5578;
    --line: #C3CBE0;
    --marigold: #FFC93C;

    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

    --gutter: clamp(1.25rem, 4vw, 3rem);
    --max: 1200px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--mist);
    color: var(--ink);
    font: 400 1.0625rem/1.6 var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body:has(dialog[open]) { overflow: hidden; }
  img, video, iframe { display: block; max-width: 100%; }
  a { color: inherit; }
  h1, h2, h3 { font-family: var(--display); margin: 0; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 6px; }

  .wrap { max-width: var(--max); margin-inline: auto; padding-inline: var(--gutter); }

  .skip {
    position: absolute; left: 1rem; top: -4rem;
    background: var(--ink); color: var(--paper);
    padding: .6rem 1rem; border-radius: 999px; z-index: 10;
  }
  .skip:focus { top: 1rem; }

  /* ---------- Top bar ---------- */
  .bar {
    display: flex; flex-wrap: wrap; gap: .75rem 2rem;
    justify-content: space-between; align-items: center;
    padding-block: 1.25rem;
  }
  .brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; text-decoration: none; }
  .bar nav { display: flex; gap: 1.5rem; }
  .bar nav a { text-decoration: none; font-weight: 500; }
  .bar nav a:hover { text-decoration: underline; text-underline-offset: .3em; }

  /* ---------- Hero ---------- */
  .hero { padding-block: clamp(3rem, 10vw, 8rem) clamp(3rem, 8vw, 5.5rem); }
  .hero h1 {
    font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 7.5rem);
    line-height: .95;
    letter-spacing: -.035em;
  }
  .line { display: block; overflow: hidden; padding-bottom: .1em; margin-bottom: -.1em; }
  .line > span {
    display: block;
    transform: translateY(105%);
    animation: rise .9s cubic-bezier(.2, .7, .2, 1) forwards;
    animation-delay: calc(var(--i) * 90ms + 100ms);
  }
  @keyframes rise { to { transform: none; } }

  .hero-foot {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
    gap: 1.5rem 2rem; margin-top: clamp(2rem, 5vw, 3.5rem);
  }
  .role { font-family: var(--display); font-weight: 600; font-size: 1.25rem; color: var(--ink-soft); margin: 0; }
  .intro { max-width: 52ch; margin: 0; font-size: 1.2rem; }
  .cta { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }

  .btn {
    display: inline-block; padding: .8rem 1.4rem; border-radius: 999px;
    background: var(--ink); color: var(--paper);
    border: 1.5px solid var(--ink);
    font-weight: 600; text-decoration: none;
  }
  .btn:hover { background: var(--marigold); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn.ghost:hover { background: var(--ink); color: var(--paper); }

  /* ---------- Work ---------- */
  .work { padding-block: clamp(2.5rem, 6vw, 4rem) clamp(3.5rem, 8vw, 6rem); }
  .work-head {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end;
    gap: 1.25rem; margin-bottom: 2rem;
  }
  h2.section-title { font-weight: 800; font-size: clamp(2rem, 5vw, 3.5rem); letter-spacing: -.03em; line-height: 1; }

  .filters { display: flex; flex-wrap: wrap; gap: .5rem; }
  .chip {
    font: inherit; font-weight: 500; font-size: .95rem;
    padding: .45rem 1rem; border-radius: 999px;
    border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
    cursor: pointer;
  }
  .chip:hover { background: var(--paper); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  .grid {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: clamp(1rem, 2.5vw, 2rem);
  }
  .card { grid-column: span 6; }
  .card:nth-child(4n+1), .card:nth-child(4n+4) { grid-column: span 7; }
  .card:nth-child(4n+2), .card:nth-child(4n+3) { grid-column: span 5; }
  .card:last-child:nth-child(odd) { grid-column: 1 / -1; }

  .card-link {
    display: block; height: 100%;
    background: var(--paper); border: 1.5px solid var(--line);
    border-radius: 26px; padding: .75rem;
    text-decoration: none;
  }
  .card-link:hover { border-color: var(--ink); }
  .thumb { height: clamp(220px, 28vw, 340px); border-radius: 18px; overflow: hidden; background: var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card-body { padding: 1rem .5rem .5rem; }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
  .card h3 { font-weight: 700; font-size: 1.4rem; letter-spacing: -.02em; line-height: 1.2; }
  .year { color: var(--ink-soft); font-variant-numeric: tabular-nums; margin: 0; }
  .card-body > p { color: var(--ink-soft); margin: .35rem 0 0; }

  .tags { display: flex; flex-wrap: wrap; gap: .4rem; list-style: none; padding: 0; margin: .9rem 0 0; }
  .tags li {
    font-size: .85rem; padding: .1rem .7rem;
    border: 1px solid var(--line); border-radius: 999px; color: var(--ink-soft);
  }

  /* ---------- About ---------- */
  .band { background: var(--paper); padding-block: clamp(3.5rem, 8vw, 6rem); }
  .about {
    display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
    gap: clamp(1.5rem, 5vw, 4rem); align-items: start;
  }
  .avatar { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 28px; background: var(--line); }
  .about-text p { max-width: 62ch; margin: 1.25rem 0 0; }

  /* ---------- Contact ---------- */
  .contact { background: var(--marigold); padding-block: clamp(3.5rem, 9vw, 7rem); }
  .mail {
    display: inline-block; margin-top: 1.5rem;
    font-family: var(--display); font-weight: 700;
    font-size: clamp(1.5rem, 5vw, 3.25rem); letter-spacing: -.03em; line-height: 1.1;
    text-decoration-thickness: .08em; text-underline-offset: .15em;
    overflow-wrap: anywhere;
  }
  .social { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; padding: 0; margin: 2rem 0 0; }

  .pill {
    display: inline-block; padding: .5rem 1.05rem; border-radius: 999px;
    border: 1.5px solid var(--ink); font-weight: 500; text-decoration: none;
  }
  .pill:hover { background: var(--ink); color: var(--paper); }
  .pill.is-ph { border-style: dashed; }

  footer { padding-block: 1.75rem; color: var(--ink-soft); font-size: .9rem; }

  /* ---------- Project viewer ---------- */
  dialog {
    width: min(1100px, calc(100% - 1.5rem));
    max-height: calc(100dvh - 1.5rem);
    padding: 0; border: 0; border-radius: 28px; overflow: hidden;
    background: var(--paper); color: var(--ink);
  }
  dialog::backdrop { background: rgba(16, 27, 61, .62); }
  dialog[open] { animation: pop .22s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(14px); } }

  .modal { display: flex; flex-direction: column; max-height: calc(100dvh - 1.5rem); }
  .modal-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: .75rem 1rem; border-bottom: 1.5px solid var(--line);
  }
  .pager { display: flex; align-items: center; gap: .5rem; }
  .pager span { min-width: 4.5rem; text-align: center; color: var(--ink-soft); font-size: .95rem; font-variant-numeric: tabular-nums; }
  .icon-btn {
    width: 2.5rem; height: 2.5rem; display: grid; place-items: center;
    border-radius: 50%; border: 1.5px solid var(--ink);
    background: transparent; color: var(--ink); cursor: pointer; padding: 0;
  }
  .icon-btn:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  .icon-btn:disabled { opacity: .35; cursor: default; }

  .modal-scroll { overflow: auto; overscroll-behavior: contain; }
  .modal-body {
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: clamp(1.25rem, 3vw, 2.5rem); padding: clamp(1rem, 3vw, 2rem); align-items: start;
  }

  .media { display: grid; gap: 1rem; }
  .video { aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: var(--ink); }
  .video video, .video iframe { width: 100%; height: 100%; border: 0; }
  .video.is-ph {
    display: grid; place-content: center; justify-items: center; gap: .35rem; text-align: center;
    background: #DCE2F0; border: 2px dashed var(--ink-soft); color: var(--ink-soft);
    padding: 1rem;
  }
  .video.is-ph p { margin: .5rem 0 0; font-weight: 600; color: var(--ink); }
  .video.is-ph small { font-size: .9rem; }

  .shot-wrap { aspect-ratio: 16 / 10; border-radius: 18px; overflow: hidden; background: var(--line); }
  .shot { width: 100%; height: 100%; object-fit: cover; }
  .thumbs {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: .5rem;
    list-style: none; padding: 0; margin: .75rem 0 0;
  }
  .thumbs button {
    display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; cursor: pointer;
    border: 2.5px solid transparent; border-radius: 12px; overflow: hidden; background: var(--line);
  }
  .thumbs button[aria-current="true"] { border-color: var(--ink); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; }

  .info h2 { font-weight: 800; font-size: clamp(1.75rem, 3.5vw, 2.5rem); letter-spacing: -.03em; line-height: 1.05; }
  .info .year { margin-bottom: .35rem; }
  .info p { max-width: 60ch; }
  .info .tags { margin-bottom: 1.25rem; }
  .details { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1.25rem; margin: 1.5rem 0 0; }
  .details dt { font-weight: 600; color: var(--ink-soft); }
  .details dd { margin: 0; }
  .links { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; padding: 0; margin: 1.75rem 0 0; }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    .hero-foot { grid-template-columns: 1fr; }
    .card, .card:nth-child(n) { grid-column: 1 / -1; }
    .thumb { height: auto; aspect-ratio: 3 / 2; }
    .about { grid-template-columns: 1fr; }
    .avatar { max-width: 240px; }
    .modal-body { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .line > span { transform: none; animation: none; }
    dialog[open] { animation: none; }
  }
</style>

<script>
(() => {
  "use strict";

  /* ---------- helpers ---------- */
  const $ = (sel, root = document) => root.querySelector(sel);

  const el = (tag, props = {}, ...kids) => {
    const node = document.createElement(tag);
    for (const [key, val] of Object.entries(props)) {
      if (key === "class") node.className = val;
      else if (key === "text") node.textContent = val;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), val);
      else if (val !== false && val != null) node.setAttribute(key, val);
    }
    kids.flat().forEach(k => k != null && node.append(k));
    return node;
  };

  const svg = markup => {
    const t = document.createElement("template");
    t.innerHTML = markup.trim();
    return t.content.firstChild;
  };

  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  /* Placeholder images are generated here, so no image files are needed. */
  const HUES = [222, 262, 190, 340, 28, 150];
  function placeholder(label, seed = 0, kind = "image") {
    const w = 1600, h = 1000, hue = HUES[Math.abs(seed) % HUES.length];
    const stroke = `hsl(${hue} 35% 28%)`;
    const icon = kind === "person"
      ? "<circle cx='80' cy='50' r='34'/><path d='M14 150c8-44 32-62 66-62s58 18 66 62'/>"
      : "<rect width='160' height='120' rx='14'/><circle cx='50' cy='42' r='14'/><path d='M8 108l44-40 34 28 24-20 42 36'/>";
    const markup =
      `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} ${h}'>` +
      `<rect width='${w}' height='${h}' fill='hsl(${hue} 42% 82%)'/>` +
      `<g transform='translate(${w / 2 - 80} ${h / 2 - 100})' fill='none' stroke='${stroke}' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' opacity='.6'>${icon}</g>` +
      `<text x='${w / 2}' y='${h / 2 + 120}' text-anchor='middle' font-family='system-ui,sans-serif' font-size='38' fill='${stroke}' opacity='.75'>${label}</text>` +
      `</svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(markup);
  }

  function setHash(hash, replace) {
    try {
      const url = hash || (location.pathname + location.search);
      replace ? history.replaceState(null, "", url) : history.pushState(null, "", url);
    } catch (_) { /* some browsers restrict history on file:// — safe to ignore */ }
  }

  /* ---------- normalise the content ---------- */
  const projects = PROJECTS.map((p, i) => {
    const images = (p.images || []).map((im, j) => {
      const o = typeof im === "string" ? { src: im } : im;
      return {
        src: o.src || placeholder(`Image ${j + 1}`, i + j),
        alt: o.alt || `${p.title} — image ${j + 1}`,
        placeholder: !o.src
      };
    });
    return {
      ...p,
      id: p.id || slug(p.title) || `project-${i + 1}`,
      tags: p.tags || [],
      description: [].concat(p.description || []),
      images,
      cover: p.cover || (images.find(x => !x.placeholder) || {}).src || placeholder("Cover image", i)
    };
  });

  /* ---------- page content ---------- */
  document.title = `${PROFILE.name} — Portfolio`;
  $("#brand").textContent = PROFILE.name;
  PROFILE.headline.forEach((text, i) => {
    $("#headline").append(el("span", { class: "line", style: `--i:${i}` }, el("span", { text })));
  });
  $("#role").textContent = PROFILE.role;
  $("#intro").textContent = PROFILE.intro;

  const avatar = $("#avatar");
  avatar.src = PROFILE.avatar || placeholder("Your photo", 1, "person");
  avatar.alt = PROFILE.avatar ? `Portrait of ${PROFILE.name}` : "";
  PROFILE.about.forEach(t => $("#about-text").append(el("p", { text: t })));

  $("#contact-title").textContent = PROFILE.contactHeading;
  const mail = $("#mail");
  mail.textContent = PROFILE.email;
  mail.href = `mailto:${PROFILE.email}`;
  PROFILE.socials.forEach(s => $("#social").append(el("li", {}, linkEl(s))));
  $("#foot").textContent = `© ${new Date().getFullYear()} ${PROFILE.name}`;

  function linkEl(l) {
    const isPlaceholder = !l.url || l.url === "#";
    const a = el("a", { class: "pill" + (isPlaceholder ? " is-ph" : ""), href: isPlaceholder ? "#" : l.url, text: l.label });
    if (isPlaceholder) a.addEventListener("click", e => e.preventDefault());
    else if (/^https?:/i.test(l.url)) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    return a;
  }

  /* ---------- filters + grid ---------- */
  const allTags = [...new Set(projects.flatMap(p => p.tags))];
  let activeTag = "All";

  const visible = () => projects.filter(p => activeTag === "All" || p.tags.includes(activeTag));

  function renderFilters() {
    const box = $("#filters");
    box.hidden = allTags.length < 2;
    box.replaceChildren(...["All", ...allTags].map(tag =>
      el("button", { class: "chip", type: "button", "aria-pressed": String(tag === activeTag), text: tag, onclick: () => setFilter(tag) })
    ));
  }

  function setFilter(tag) {
    activeTag = tag;
    renderFilters();
    renderGrid();
  }

  const tagList = tags => tags && tags.length
    ? el("ul", { class: "tags" }, tags.map(t => el("li", { text: t })))
    : null;

  function card(p) {
    return el("li", { class: "card" },
      el("a", { class: "card-link", href: `#p-${p.id}`, "data-id": p.id },
        el("div", { class: "thumb" }, el("img", { src: p.cover, alt: "", loading: "lazy" })),
        el("div", { class: "card-body" },
          el("div", { class: "card-top" },
            el("h3", { text: p.title }),
            p.year ? el("span", { class: "year", text: p.year }) : null),
          p.summary ? el("p", { text: p.summary }) : null,
          tagList(p.tags))));
  }

  function renderGrid() {
    $("#grid").replaceChildren(...visible().map(card));
  }

  /* ---------- project viewer ---------- */
  const dlg = $("#viewer");
  let current = { list: [], i: 0 };
  let lastOpener = null;

  function videoBlock(p) {
    const v = p.video;
    const wrap = el("div", { class: "video" });
    if (!v.src) {
      wrap.classList.add("is-ph");
      wrap.append(
        svg(`<svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><circle cx="28" cy="28" r="26"/><path d="M23 19l15 9-15 9z"/></svg>`),
        el("p", { text: "Video placeholder" }),
        el("small", { text: "Add a video file or embed link in this project's data." })
      );
    } else if (v.type === "embed") {
      wrap.append(el("iframe", {
        src: v.src, title: `${p.title} video`, loading: "lazy", allowfullscreen: "",
        allow: "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share",
        referrerpolicy: "strict-origin-when-cross-origin"
      }));
    } else {
      wrap.append(el("video", { src: v.src, poster: v.poster || false, controls: "", playsinline: "", preload: "metadata" }));
    }
    return wrap;
  }

  function gallery(p) {
    const first = p.images[0];
    const main = el("img", { class: "shot", src: first.src, alt: first.alt });
    const box = el("div", { class: "gallery" }, el("div", { class: "shot-wrap" }, main));
    if (p.images.length > 1) {
      const list = el("ul", { class: "thumbs" });
      p.images.forEach((im, j) => {
        const btn = el("button", {
          type: "button",
          "aria-label": `Show image ${j + 1} of ${p.images.length}`,
          "aria-current": String(j === 0),
          onclick: () => {
            main.src = im.src;
            main.alt = im.alt;
            [...list.children].forEach((li, k) => li.firstChild.setAttribute("aria-current", String(k === j)));
          }
        }, el("img", { src: im.src, alt: "" }));
        list.append(el("li", {}, btn));
      });
      box.append(list);
    }
    return box;
  }

  function fill(p) {
    const { list, i } = current;
    $("#count").textContent = `${i + 1} of ${list.length}`;
    $("#prev").disabled = $("#next").disabled = list.length < 2;

    const media = el("div", { class: "media" });
    if (p.video) media.append(videoBlock(p));
    if (p.images.length) media.append(gallery(p));

    let details = null;
    if (p.details && p.details.length) {
      details = el("dl", { class: "details" });
      p.details.forEach(d => details.append(el("dt", { text: d.label }), el("dd", { text: d.value })));
    }
    const links = p.links && p.links.length
      ? el("ul", { class: "links" }, p.links.map(l => el("li", {}, linkEl(l))))
      : null;

    const info = el("div", { class: "info" },
      p.year ? el("p", { class: "year", text: p.year }) : null,
      el("h2", { id: "viewer-title", text: p.title }),
      tagList(p.tags),
      p.description.map(t => el("p", { text: t })),
      details,
      links);

    $("#viewer-body").replaceChildren(...(media.children.length ? [media] : []), info);
    $(".modal-scroll").scrollTop = 0;
  }

  /* mode: "push" (new history entry), "replace", or "none" */
  function openProject(id, opener, mode = "push") {
    let list = visible();
    let i = list.findIndex(p => p.id === id);
    if (i < 0) {
      setFilter("All");
      list = visible();
      i = list.findIndex(p => p.id === id);
      if (i < 0) return;
    }
    current = { list, i };
    if (opener) lastOpener = opener;
    fill(list[i]);
    if (!dlg.open) dlg.showModal();
    if (mode !== "none") setHash(`#p-${id}`, mode === "replace");
  }

  function step(dir) {
    const { list, i } = current;
    if (list.length < 2) return;
    openProject(list[(i + dir + list.length) % list.length].id, null, "replace");
  }

  $("#grid").addEventListener("click", e => {
    const a = e.target.closest(".card-link");
    if (!a) return;
    e.preventDefault();
    openProject(a.dataset.id, a);
  });
  $("#prev").addEventListener("click", () => step(-1));
  $("#next").addEventListener("click", () => step(1));
  $("#close").addEventListener("click", () => dlg.close());
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener("keydown", e => {
    if (e.target.closest("video")) return;
    if (e.key === "ArrowLeft") step(-1);
    if (e.key === "ArrowRight") step(1);
  });
  dlg.addEventListener("close", () => {
    $("#viewer-body").replaceChildren();          /* stops any playing video */
    if (/^#p-/.test(location.hash)) setHash("", true);
    if (lastOpener) lastOpener.focus({ preventScroll: true });
  });

  /* open/close from the address bar and the back button */
  function route() {
    const m = location.hash.match(/^#p-(.+)$/);
    if (m) openProject(decodeURIComponent(m[1]), null, "none");
    else if (dlg.open) dlg.close();
  }
  addEventListener("popstate", route);

  renderFilters();
  renderGrid();
  route();
})();
</script>
</body>
</html>
